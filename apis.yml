name: Merico
description: >-
  Merico is a developer-analytics company behind DevInsight, an engineering
  intelligence platform that ingests data from DevOps tools like GitHub, GitLab,
  Jira, and Jenkins to surface DORA metrics, resource allocation, sprint
  planning insight, and customizable engineering dashboards. Merico is the
  original creator and primary maintainer of Apache DevLake, the open-source
  dev-data platform that powers DevInsight, exposing a self-hosted REST API and
  an inbound webhook connector for pushing DevOps data from tools without a
  dedicated plugin. The company operates a cloud SaaS at cloud.devinsight.ai and
  maintains SOC 1 Type II and SOC 2 Type II attestations.
